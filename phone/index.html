<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="body">
    <section id="face">
      <img id="gif" alt="" />
    </section>

    <section id="panel">
      <div id="emotion">hello</div>
      <div id="text">Waiting for the companion app...</div>
      <div id="ask" hidden>
        <button type="button" id="ask-yes">Yes</button>
        <button type="button" id="ask-no">No</button>
      </div>
    </section>
  </main>

  <form id="bar" autocomplete="off">
    <span id="status" class="offline" title="Connection">offline</span>
    <input id="input" placeholder="Say something..." enterkeyhint="send" />
    <button type="submit" id="send" title="Send">➤</button>
    <button type="button" id="mic" title="Hold to talk" hidden>🎤</button>
    <button type="button" id="speak" title="Read replies aloud">🔇</button>
    <button type="button" id="fullscreen" title="Fullscreen">⛶</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
