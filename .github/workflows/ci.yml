name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend type-check and build
        run: |
          npm ci
          npm run build

      # tauri-build wants the sidecar and resource folders to exist. The real
      # Ollama/whisper downloads are large and not needed to compile and test.
      - name: Placeholder sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/lib/ollama src-tauri/binaries/whisper
          touch "src-tauri/binaries/ollama-${{ matrix.triple }}${{ matrix.ext }}"
          touch src-tauri/binaries/lib/ollama/.keep src-tauri/binaries/whisper/.keep

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Phone page scripts parse
        run: node --check phone/app.js && node --check phone/avatar.js
