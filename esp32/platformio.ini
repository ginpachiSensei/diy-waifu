; ESP32 "body" firmware. From this folder:
;   pio run -e wokwi                     build for the Wokwi simulator, then "Wokwi: Start Simulator"
;   pio run -e esp32dev -t upload        flash a real board (Wi-Fi setup hotspot on first boot)
; `pio run` builds both.

[platformio]
default_envs = wokwi, esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; App ~3 MB, plus ~900 KB of LittleFS where GIFs from the app are cached
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
extra_scripts = post:tools/merge_bin.py
lib_deps =
    adafruit/Adafruit ILI9341
    adafruit/Adafruit GFX Library
    bitbank2/AnimatedGIF
    links2004/WebSockets
    bblanchon/ArduinoJson@^7

; Real hardware: WiFiManager setup portal, mDNS discovery, pairing code
[env:esp32dev]
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@^2.0.17

; Wokwi simulator: fixed Wokwi-GUEST Wi-Fi and host.wokwi.internal
[env:wokwi]
build_flags = -DWOKWI
