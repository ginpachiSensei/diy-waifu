; ESP32 "body" firmware. Build with `pio run` from this folder, then start
; the Wokwi simulator in VS Code (it reads wokwi.toml + diagram.json here).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The embedded GIFs need more than the default 1.2 MB app partition
board_build.partitions = huge_app.csv
extra_scripts = post:tools/merge_bin.py
lib_deps =
    adafruit/Adafruit ILI9341
    adafruit/Adafruit GFX Library
    bitbank2/AnimatedGIF
    links2004/WebSockets
    bblanchon/ArduinoJson@^7
